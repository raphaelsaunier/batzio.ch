name: CI

# Automatic CI runs are disabled for now; trigger manually via Actions → CI → Run workflow.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web, API and shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:gen
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  apple:
    name: Apple (iOS, iPadOS, macOS, visionOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/apple
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: swift test
        working-directory: apps/apple/BatzioKit
      - run: xcodegen generate
      - run: xcodebuild -project Batzio.xcodeproj -scheme Batzio -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project Batzio.xcodeproj -scheme Batzio -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project Batzio.xcodeproj -scheme Batzio -destination 'generic/platform=visionOS Simulator' CODE_SIGNING_ALLOWED=NO build

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

  android-device:
    name: Android on a device (on-device engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: apps/android
          script: ./gradlew :app:connectedDebugAndroidTest

  windows:
    name: Windows (WinUI 3)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Batzio.Core.Tests
      - run: dotnet build Batzio.App/Batzio.App.csproj -c Release -p:Platform=x64
