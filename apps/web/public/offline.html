<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Batzio</title>
    <link rel="icon" href="/favicon.svg" />
    <!-- Served by the service worker for pages never opened on this device. Colours from @batzio/tokens. -->
    <style>
      :root {
        --background: #edf3fa;
        --foreground: #152030;
        --muted: #606d7d;
        --card: #ffffff;
        --primary: #2863ab;
        --primary-foreground: #fafcfe;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #101724;
          --foreground: #eaeff5;
          --muted: #97a7b7;
          --card: #111a27;
          --primary: #5eaceb;
          --primary-foreground: #07101c;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--background);
        color: var(--foreground);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 26rem;
        padding: 2.5rem 2rem;
        border-radius: 1.5rem;
        background: var(--card);
        text-align: center;
        box-shadow: 8px 8px 20px rgb(0 0 0 / 0.08), -8px -8px 20px rgb(255 255 255 / 0.5);
      }
      img {
        width: 80px;
        height: 80px;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 0.6rem 1.4rem;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/coin-front-160.webp" alt="" />
      <h1 id="title">You’re offline</h1>
      <p id="text">This page hasn’t been opened on this device yet. Pages you have visited before still work.</p>
      <button id="retry" type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      const copy = {
        de: ["Sie sind offline", "Diese Seite wurde auf diesem Gerät noch nie geöffnet. Bereits besuchte Seiten funktionieren weiterhin.", "Nochmals versuchen"],
        fr: ["Vous êtes hors ligne", "Cette page n’a pas encore été ouverte sur cet appareil. Les pages déjà visitées fonctionnent toujours.", "Réessayer"],
        it: ["È offline", "Questa pagina non è ancora stata aperta su questo dispositivo. Le pagine già visitate funzionano ancora.", "Riprova"],
      };
      const cookie = /(?:^|; )batzio_locale=(\w+)/.exec(document.cookie)?.[1];
      const lang = [cookie, ...navigator.languages.map((l) => l.slice(0, 2))].find((l) => l && copy[l]);
      if (lang) {
        document.documentElement.lang = lang;
        [title.textContent, text.textContent, retry.textContent] = copy[lang];
      }
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
